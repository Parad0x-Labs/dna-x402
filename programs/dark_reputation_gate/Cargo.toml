[package]
name = "dark-reputation-gate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# `devnet` compiles out the mainnet_ready fail-closed VK guard (single-party devnet
# ceremony). Mainnet omits it -> guard active. Mirrors dark_x402_access_gate.
devnet = []

[dependencies]
solana-program    = { workspace = true }
dark-groth16-core = { path = "../../crates/dark-groth16-core" }

[dev-dependencies]
solana-program-test = { workspace = true }
solana-sdk          = { workspace = true }
tokio               = { workspace = true }
