[package]
name = "dark-secp256k1-auth"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# No-op: the secp256k1 precompile binding is enforced in every build. Kept so
# existing `cargo build-sbf --features mainnet` commands keep working.
mainnet = []

[dependencies]
solana-program = { workspace = true }

[dev-dependencies]
libsecp256k1       = "0.6.0"
solana-program-test = { workspace = true }
solana-sdk         = { workspace = true }
tokio              = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic", "mainnet"))',
    'cfg(target_os, values("solana"))',
] }
