version: 2
updates:
  # npm / Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    groups:
      production-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"
    ignore:
      # @noble 2.x drops the extensionless subpath exports (sha256, utils, hkdf,
      # ed25519, secp256k1) that the workspace packages import; moving to 2.x is
      # a deliberate crypto-library migration, not a lockfile bump.
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
      # ts-jest 29 supports typescript >=4.3 <7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node majors move with the Node runtime CI uses, not on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Cargo / Rust
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    ignore:
      # BN254 / Groth16 stack: ark-bn254, ark-ff, ark-ec, ark-serialize and
      # light-poseidon must move together as one family and stay byte-compatible
      # with the alt_bn128 / sol_poseidon syscalls. Single-crate 0.4 -> 0.6 bumps
      # do not compile (trait/type mismatches across ark generations).
      - dependency-name: "ark-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "light-poseidon"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # sha2 0.9 is required next to curve25519-dalek 3.2.1 (digest 0.9 API,
      # pinned by solana-program 1.18). Digest-generation moves are manual.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Solana 1.18 -> 2.x is one coordinated upgrade across the programs and the
      # solana-program-test harness; a lone solana-program 2.x bump does not compile.
      - dependency-name: "solana-*"
        update-types: ["version-update:semver-major"]
      # rand 0.9+ drops rand::RngCore / rand::rngs::OsRng; dark-kvac and
      # dark-fedimint-ecash feed the RNG into curve25519-dalek 3.x (rand_core 0.5/0.6),
      # so the rand major moves with the curve25519-dalek 4.x migration.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
